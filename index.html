<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 방명록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            background-color: #fff5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <!-- 헤더 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-pink-600 mb-2">💖 핑크 방명록 💖</h1>
            <p class="text-pink-400 text-sm">작성한 방명록은 브라우저에 저장되며, 엑셀 파일로 백업 및 복원할 수 있습니다.</p>
        </header>

        <!-- 방명록 입력 폼 -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-pink-100 mb-8">
            <form id="guestbookForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-pink-400 mb-1">작성자</label>
                    <input type="text" id="authorInput" placeholder="닉네임을 입력하세요" required
                        class="w-full px-4 py-2 text-sm rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-pink-400 mb-1">메시지</label>
                    <textarea id="messageInput" rows="3" placeholder="따뜻한 한마디를 남겨주세요 💕" required
                        class="w-full px-4 py-2 text-sm rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 resize-none"></textarea>
                </div>
                <button type="submit"
                    class="w-full py-3 bg-pink-400 hover:bg-pink-500 text-white font-semibold rounded-xl shadow-md transition-all text-sm">
                    방명록 남기기 ✨
                </button>
            </form>
        </div>

        <!-- 엑셀 데이터 관리 컨트롤 -->
        <div class="bg-pink-50 rounded-2xl p-4 border border-pink-200 mb-8 flex flex-wrap gap-3 items-center justify-between">
            <span class="text-xs font-bold text-pink-600">📊 엑셀 데이터 관리</span>
            <div class="flex gap-2 w-full sm:w-auto">
                <button id="exportBtn" class="flex-1 sm:flex-none px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs rounded-lg font-medium shadow-sm transition">
                    엑셀로 내보내기 (.xlsx)
                </button>
                <label class="flex-1 sm:flex-none px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white text-xs rounded-lg font-medium shadow-sm transition cursor-pointer text-center">
                    엑셀 불러오기
                    <input type="file" id="importInput" accept=".xlsx, .xls" class="hidden">
                </label>
            </div>
        </div>

        <!-- 방명록 목록 -->
        <div id="guestbookList" class="space-y-4">
            <!-- 방명록 카드가 동적으로 추가됩니다 -->
        </div>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('guestbook_entries')) || [
            {
                id: 1,
                author: "체리",
                message: "오늘도 좋은 하루 되세요! 🌸",
                likes: 5,
                createdAt: new Date().toLocaleString('ko-KR')
            }
        ];

        const form = document.getElementById('guestbookForm');
        const authorInput = document.getElementById('authorInput');
        const messageInput = document.getElementById('messageInput');
        const guestbookList = document.getElementById('guestbookList');
        const exportBtn = document.getElementById('exportBtn');
        const importInput = document.getElementById('importInput');

        function saveEntries() {
            localStorage.setItem('guestbook_entries', JSON.stringify(entries));
            renderEntries();
        }

        function getAvatarColor(name) {
            const colors = ['bg-pink-300', 'bg-rose-300', 'bg-purple-300', 'bg-fuchsia-300', 'bg-peach-300'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash += name.charCodeAt(i);
            return colors[hash % colors.length];
        }

        function renderEntries() {
            guestbookList.innerHTML = '';
            if (entries.length === 0) {
                guestbookList.innerHTML = `
                    <div class="text-center py-12 text-pink-300 text-sm">
                        아직 방명록이 없습니다. 첫 번째 글을 남겨보세요! ✨
                    </div>
                `;
                return;
            }

            entries.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-pink-100 transition hover:shadow-md";
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full ${getAvatarColor(item.author)} text-white flex items-center justify-center font-bold text-sm">
                                ${item.author.charAt(0)}
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm">${item.author}</h3>
                                <p class="text-[10px] text-pink-300">${item.createdAt}</p>
                            </div>
                        </div>
                        <button onclick="toggleLike(${index})" class="flex items-center gap-1 text-xs bg-pink-50 hover:bg-pink-100 text-pink-500 px-2.5 py-1 rounded-full transition">
                            💖 <span>${item.likes || 0}</span>
                        </button>
                    </div>
                    <p class="text-gray-600 text-sm leading-relaxed">${item.message}</p>
                `;
                guestbookList.appendChild(card);
            });
        }

        function toggleLike(index) {
            entries[index].likes = (entries[index].likes || 0) + 1;
            saveEntries();
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const newEntry = {
                id: Date.now(),
                author: authorInput.value.trim(),
                message: messageInput.value.trim(),
                likes: 0,
                createdAt: new Date().toLocaleString('ko-KR')
            };
            entries.unshift(newEntry);
            saveEntries();
            form.reset();
        });

        // 엑셀 내보내기 (SheetJS)
        exportBtn.addEventListener('click', () => {
            const exportData = entries.map(item => ({
                '작성자': item.author,
                '메시지': item.message,
                '좋아요': item.likes || 0,
                '작성시간': item.createdAt
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "방명록 목록");

            XLSX.writeFile(workbook, "방명록_백업.xlsx");
        });

        // 엑셀 불러오기 (SheetJS)
        importInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                const importedEntries = jsonData.map((row, idx) => ({
                    id: Date.now() + idx,
                    author: row['작성자'] || '익명',
                    message: row['메시지'] || '',
                    likes: parseInt(row['좋아요']) || 0,
                    createdAt: row['작성시간'] || new Date().toLocaleString('ko-KR')
                }));

                entries = [...importedEntries, ...entries];
                saveEntries();
                alert('엑셀 방명록 데이터를 성공적으로 불러왔습니다!');
            };
            reader.readAsArrayBuffer(file);
        });

        renderEntries();
    </script>
</body>
</html>
